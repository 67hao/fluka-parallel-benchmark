name: Run S1 Glass 150keV FLUKA Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - 'user_run/**'
      - '.github/workflows/run_s1_user.yml'

jobs:
  run-s1-fluka:
    name: Run S1 Glass @ 150 keV
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reassemble & Install FLUKA
        shell: bash
        run: |
          echo ">>> Reassembling FLUKA package..."
          cat packages/fluka_deb.part_* > fluka.deb
          
          echo ">>> Installing gfortran-9 and dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran-9 libgfortran5
          sudo dpkg -i --force-depends fluka.deb || sudo apt-get install -f -y -qq
          
          which rfluka || true

      - name: Execute FLUKA Simulation
        shell: bash
        run: |
          cd user_run
          export PATH="/usr/local/flukagfor/bin:/usr/local/fluka/bin:/usr/local/bin:$PATH"
          export FLUFOR=gfortran
          
          echo "=========================================================="
          echo ">>> [1/2] Checking input deck s1_150keV_th1cm.inp..."
          echo "=========================================================="
          cat s1_150keV_th1cm.inp
          
          # Prepare input for FLUKA 4 execution
          # FLUKA 4 needs LOW-PWXS -1.0 if pointwise neutron library is not installed
          # and WHAT(2) blank for MATERIAL if deprecated
          cp s1_150keV_th1cm.inp run_fluka.inp
          
          python3 -c "
          with open('s1_150keV_th1cm.inp', 'r') as f:
              lines = f.readlines()
          
          out = []
          for line in lines:
              # Check DEFAULTS line to add LOW-PWXS
              if line.startswith('DEFAULTS'):
                  out.append(line)
                  out.append('LOW-PWXS     -1.0000\n')
                  continue
              # In FLUKA 4, WHAT(2) in MATERIAL cards must be blank (0.0)
              if line.startswith('MATERIAL') and not line.startswith('MATERIAL         0.0       0.0'):
                  # Replace WHAT(2) columns 21-30 with spaces/0.0
                  # Format: (A10, 6(F10.0), A10)
                  card = line[:20] + '          ' + line[30:]
                  out.append(card)
                  continue
              out.append(line)
          
          with open('run_fluka.inp', 'w') as f:
              f.writelines(out)
          "
          
          echo "=========================================================="
          echo ">>> [2/2] Running rfluka with 1,000,000 primaries..."
          echo "=========================================================="
          rfluka -N0 -M1 run_fluka.inp || {
            EXIT_CODE=$?
            echo "=== FLUKA EXITED WITH CODE $EXIT_CODE ==="
            ls -la
            ls -la fluka_* 2>/dev/null || true
            for f in fluka_*/*; do
              if [ -f "$f" ]; then
                echo "=== FILE: $f ==="
                cat "$f" | tail -n 80 || true
              fi
            done
            exit $EXIT_CODE
          }
          
          echo ">>> Simulation finished successfully. Output files:"
          ls -lh

      - name: Process & Extract Physics Data
        shell: bash
        run: |
          cd user_run
          export PATH="/usr/local/flukagfor/bin:/usr/local/fluka/bin:/usr/local/bin:$PATH"
          
          python3 -c "
          import glob, os, struct, math
          
          # Search for fort.22 (USRBDX uncollided primary photons)
          fort22_files = glob.glob('*_fort.22') + glob.glob('fluka_*/*_fort.22')
          out_files = glob.glob('*.out') + glob.glob('fluka_*/*.out')
          
          print('='*60)
          print('FLUKA S1 GLASS (150 keV) RUN REPORT')
          print('='*60)
          
          if out_files:
              with open(out_files[0], 'r', errors='ignore') as f:
                  content = f.read()
              for line in content.splitlines():
                  if 'Total CPU time used' in line:
                      print(line.strip())
                  if 'Maximum RAM used' in line:
                      print(line.strip())
                  if 'missing' in line:
                      print('Energy conservation:', line.strip())
          
          if fort22_files:
              fort_file = fort22_files[0]
              print(f'Parsing USRBDX binary: {fort_file} ({os.path.getsize(fort_file)} bytes)')
              with open(fort_file, 'rb') as f:
                  data = f.read()
              
              offset = 0
              records = []
              while offset < len(data):
                  reclen = struct.unpack('<I', data[offset:offset+4])[0]
                  offset += 4
                  payload = data[offset:offset+reclen]
                  offset += reclen
                  offset += 4
                  records.append(payload)
              
              print(f'Total binary records: {len(records)}')
              # Find float records
              for idx, rec in enumerate(records):
                  if len(rec) >= 4 and len(rec) % 4 == 0:
                      vals = struct.unpack(f'<{len(rec)//4}f', rec)
                      if any(v > 0 for v in vals):
                          print(f'Record {idx+1} values:', vals)
                          # First non-zero value is uncollided fluence
                          uncoll_fluence = vals[0]
                          area = 78.5398 # cm2
                          transmission = uncoll_fluence * area
                          thickness = 1.0 # cm
                          density = 3.1 # g/cm3
                          if 0 < transmission < 1:
                              mu = -math.log(transmission) / thickness
                              mu_rho = mu / density
                              print('-'*60)
                              print(f'Uncollided Fluence (dPhi/dE/dA) = {uncoll_fluence:.6e} part/cm2/GeV/prim')
                              print(f'Total Uncollided Transmission (I/I0) = {transmission:.6e}')
                              print(f'Linear Attenuation Coefficient (mu) = {mu:.4f} cm^-1')
                              print(f'Mass Attenuation Coefficient (mu/rho) = {mu_rho:.4f} cm^2/g')
                              print(f'Half-Value Layer (HVL) = {math.log(2)/mu:.4f} cm')
                              print('-'*60)
          print('='*60)
          "

      - name: Upload Simulation Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S1_GLASS_150KEV_RESULTS
          path: |
            user_run/*.out
            user_run/*.lis
            user_run/*.log
            user_run/*fort*
            user_run/run_fluka.inp
          retention-days: 14

      - name: Upload Results Directly to Google Drive
        if: always()
        env:
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 -c "
          import os, glob, json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          if 'GDRIVE_OAUTH_JSON' not in os.environ or not os.environ['GDRIVE_OAUTH_JSON']:
              print('No GDRIVE_OAUTH_JSON secret found, skipping drive upload.')
              exit(0)

          oauth_info = json.loads(os.environ['GDRIVE_OAUTH_JSON'])
          creds = Credentials.from_authorized_user_info(oauth_info)
          service = build('drive', 'v3', credentials=creds)
          folder_id = os.environ.get('GDRIVE_FOLDER_ID', '1Q3KE3Ncfm-Nn6FIbGhFXs25HFIq-InOn')

          files_to_upload = glob.glob('user_run/*.out') + glob.glob('user_run/*.lis') + glob.glob('user_run/*fort*')

          print(f'>>> Uploading {len(files_to_upload)} files to Google Drive folder {folder_id}...')
          for fp in files_to_upload:
              fn = os.path.basename(fp)
              meta = {'name': fn, 'parents': [folder_id]}
              media = MediaFileUpload(fp, resumable=True)
              res = service.files().create(body=meta, media_body=media, fields='id, name').execute()
              print(f' -> Uploaded: {res.get(\"name\")} (ID: {res.get(\"id\")})')
          print('>>> Google Drive upload finished successfully!')
          "

